[package]
name = "sideporch-load"
version = "0.1.0"
edition = "2024"
publish = false
description = "Simulates people using a Sideporch server, to find how many it can serve"

# Its own workspace, so it builds without Sideporch's dependencies.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hdrhistogram = "7"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }

[profile.release]
debug = false
