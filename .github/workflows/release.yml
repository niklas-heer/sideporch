name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  nix:
    name: Source build with Nix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check --print-build-logs

  macos:
    needs: [verify, nix]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      MISE_AUTO_INSTALL: "false"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
        with:
          version: "2026.9.5"
          install_args: "rust"
          cache: true
      - run: mise run build
      - name: Verify the tag and archive the binary
        shell: bash
        run: |
          version=$(target/release/sideporch --version)
          version=${version#sideporch }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag does not match the Cargo package version" >&2
            exit 1
          fi
          sh scripts/package.sh "$version" "$RELEASE_TARGET" target/release/sideporch dist
          sh scripts/smoke-archive.sh "$version" "$RELEASE_TARGET" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sideporch-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Static Linux binaries (Dagger + zig)
    needs: [verify, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the package version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_ENV"
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: "0.21.9"
          verb: call
          args: linux-archives --version ${{ env.VERSION }} export --path dist
      - name: Run the x86-64 archive
        run: sh scripts/smoke-archive.sh "$VERSION" x86_64-unknown-linux-musl dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sideporch-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    if: github.ref_type == 'tag' && github.event_name == 'push'
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sideporch-*
          merge-multiple: true
          path: dist
      - name: Generate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          sh scripts/release-checksums.sh "$version" dist
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Sideporch $GITHUB_REF_NAME" \
            --generate-notes dist/*.tar.gz dist/SHA256SUMS

  image:
    name: Publish release images
    if: github.ref_type == 'tag' && github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        tag: [version, minor, latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Choose the image tag
        run: |
          version=${GITHUB_REF_NAME#v}
          case "${{ matrix.tag }}" in
            version) echo "IMAGE_TAG=$version" >> "$GITHUB_ENV" ;;
            minor) echo "IMAGE_TAG=${version%.*}" >> "$GITHUB_ENV" ;;
            latest) echo "IMAGE_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "0.21.9"
          verb: call
          args: publish --tag ${{ env.IMAGE_TAG }} --username ${{ github.actor }} --password env://REGISTRY_TOKEN
